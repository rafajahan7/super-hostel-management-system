<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login Form</title>
</head>

<body>

    <div class="login-card">

       
        <div class="brand-panel">
            <h1>SUPER HOSTEL MANAGEMENT </h1>
           
            

            <h2>Your Comfort, Our Priority.</h2>
            <p class="desc">A smarter way to manage hostel life.</p>

            <div class="features">
             <p class="feature-item">Smart Living</p>
             <p class="feature-item">Quality Services</p>
             <p class="feature-item">Secure Accommodation</p>
            </div>
        </div>

      
        <div class="form-panel">
            <h2>Welcome back</h2>
            <p class="subtitle">Please login to your account</p>

            
<form id="loginForm">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>

    <label for="role">Select Role</label>
    <select id="role" name="role" required>
        <option value="">Choose your role</option>
        <option value="administrator">Administrator</option>
        <option value="user">User</option>
        <option value="staff">Staff</option>
        <option value="accountant">Accountant</option>
    </select>

    <div class="options">
        <div class="remember-me">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember Me</label>
        </div>

        <a href="../code/passwordreset.html">Forgot Password?</a>
    </div>

    <input type="submit" value="Login">
    <input type="reset" value="Reset">

    <p class="signup">
        Don't have an account?
        <a href="../admin/registration.html">Create Account</a>
    </p>

</form>

<script src="../js/login.js"></script>


</body>
</html>
