
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/registration.css">

    <title>Registration Form</title>
</head>

<body>

    <div class="registration-card">

       
        <div class="brand-panel">

            <h1>SUPER HOSTEL MANAGEMENT</h1>

            <h2>Your Comfort, Our Priority.</h2>

            <p class="desc">
                A smarter way to manage hostel life.
            </p>

            <div class="features">
             
                <p class="feature-item">Smart Living</p>
                <p class="feature-item">Quality Services</p>
                <p class="feature-item">Secure Accommodation</p>
            </div>

        </div>


      
        <div class="form-panel">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register to access our hostel services
            </p>

            <form action="../admin/login.html" method="get">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>


                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>


                <label>Gender</label>

                <div class="gender-group">

                    <input type="radio" id="male" name="gender"
                           value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender"
                           value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender"
                           value="Other">
                    <label for="other">Other</label>

                </div>


                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>


                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password"
                       minlength="8" required>


                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="8" required>


                <label for="address">Address</label>
                <textarea id="address" name="address"
                          rows="4"
                          placeholder="Enter your address"
                          required></textarea>


                <label for="department">Role</label>
                <select id="department" name="department" required>

                    <option value="">Select Role</option>
                    <option value="user">User</option>
                    <option value="staff">Service Staff </option>
                    <option value="administratr">Hostel Administrator</option>
                    <option value="accountant">Hostel Accountant</option>

                </select>


                <div class="terms-group">

                    <input type="checkbox" id="terms"
                           name="terms" required>

                    <label for="terms">
                        I agree to the Terms and Conditions
                    </label>

                </div>


                <div class="button-group">

                    <input type="submit" value="Register">

                    <input type="reset" value="Reset">

                </div>

            </form>

        </div>

    </div>

</body>

</html>
