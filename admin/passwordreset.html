<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/passwordreset.css">
    <title>Login Form</title>
</head>

<body>

    <div class="reset-card">

       
        <div class="brand-panel">
            <h1>SUPER HOSTEL MANAGEMENT </h1>
           
            

            <h2>Your Comfort, Our Priority.</h2>
            <p class="desc">A smarter way to manage hostel life.</p>

            <div class="features">
             <p class="feature-item">Smart Living</p>
             <p class="feature-item">Quality Services</p>
             <p class="feature-item">Secure Accommodation</p>
            </div>
        </div>
        <div class="form-panel">

            <h2>Change Password</h2>
            <p class="subtitle">Update your account password</p>

            <form action="#" method="post">

                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword"
                name="currentPassword" placeholder="Enter current password" required>

                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword"
                name="newPassword" placeholder="Enter new password"
                minlength="8" required>

                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword"
                name="confirmPassword" placeholder="Confirm new password"
                minlength="8" required>

                <input type="submit" value="Change Password">
                <input type="reset" value="Reset">

                <p class="back-login">
                    <a href="../code/login.html">Back to Login</a>
                </p>

            </form>

        </div>

    </div>

</body>
</html>
